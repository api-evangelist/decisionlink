apis:
- name: Xfactor.io Value Proposition API
  description: The largest of the Xfactor.io platform services — 88 paths and 109 operations
    covering value propositions, companies, accounts, solutions and products, benefits and value
    drivers, workflows, discovery, privileges and users, plus account factors and mappings. This is
    the CVM core DecisionLink was built on, now served as a FastAPI service behind Auth0 bearer
    authentication. The OpenAPI 3.1 document and its Swagger UI are reachable anonymously; every
    operation requires a token.

- name: Xfactor.io Value Chat API
  description: The Growth AI conversational service — chat sessions and history, prompt management,
    file upload, feedback, and long-running generation jobs for value propositions and value models
    with a /stream/{job_id}/status polling surface. 17 paths, 20 operations, Auth0 bearer

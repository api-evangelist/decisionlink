x-unpointered-artifacts:
- file: well-known/decisionlink-well-known.yml
  reason: >-
    Records an absence. Every /.well-known/ path on every host Xfactor.io controls returned 404,
    301-with-no-body, or a 403 SPA shell, so no WellKnown or SecurityTxt pointer is emitted — the
    pointer would assert a surface the provider does not serve.
- file: mcp/decisionlink-mcp.yml
  reason: >-
    A derived candidate tool list, not a server. deployment.mode is none and there is no endpoint,
    so no MCPServer pointer is emitted — the pointer would read as a verified agent surface.
- file: conventions/decisionlink-conventions.yml
  reason: >-
    Wired as Conventions, but deliberately NOT as Idempotency. No idempotency key exists in any of
    the 156 operations; the artifact records the gap, not a capability.

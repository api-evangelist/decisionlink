name: DecisionLink
description: 'DecisionLink pioneered enterprise Customer Value Management (CVM), giving B2B sales,
  marketing, and customer-success teams a platform to quantify, present, and defend the economic
  value their products deliver to buyers. The company has since rebranded and relaunched as
  Xfactor.io, a revenue-operations AI platform that builds a "digital twin" of a company''s
  go-to-market system: it unifies CRM, pipeline, usage, and finance signals into Xfactor Central,
  surfaces cross-source risk through Xfactor OpenInsights with plain-English alerts, and lets teams
  simulate growth scenarios before committing with Xfactor Simulation and Growth AI. Backed by
  Accel, the company sells to revenue and go-to-market leaders. The platform runs on a set of
  FastAPI services behind api.xfactor.io — Value Proposition, Value Facts, Value Chat and
  Collaboration Manager — which serve live OpenAPI 3.1 documents and Swagger UI reference pages
  anonymously, while every operation itself is protected by Auth0 bearer tokens. There is no
  developer portal, pricing page, or published onboarding path: the subscription agreement and
  data-processing addendum are the only places the company describes its APIs in prose, and
  API-based access is issued as SHA-256-hashed API keys to contracted customers. Security posture
  is published via a SecureFrame trust center (SOC 2 Type II).'

openapi: 3.2.0
info:
  title: Value Proposition Groups API
  version: 0.1.0
tags:
- name: Groups
paths:
  /v1/value-proposition/groups/{valuePropGroupId}:
    delete:
      tags:
      - Groups
      summary: Delete value prop group
      description: Endpoint for deleting a value prop group
      operationId: delete_value_prop_group_v1_value_proposition_groups__valuePropGroupId__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: valuePropGroupId
        in: path
        required: true
        schema:
          type: integer
          title: Valuepropgroupid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
      description: Response model for simple message responses
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Access token in the form of a JWT
      scheme: bearer

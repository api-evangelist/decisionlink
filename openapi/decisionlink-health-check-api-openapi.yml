openapi: 3.2.0
info:
  title: Value Chat Server Healthcheck API
  description: Value chat service
  version: '1.0'
tags:
- name: Health Check
paths:
  /healthz:
    get:
      tags:
      - Health Check
      summary: Perform a Health Check
      operationId: get_health_healthz_get
      responses:
        '200':
          description: Return HTTP Status Code 200 (OK)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
components:
  schemas:
    HealthCheck:
      properties:
        status:
          type: string
          title: Status
          default: OK
      type: object
      title: HealthCheck
      description: Response model for health check.
  securitySchemes:
    HTTPBearer:
      type: http
      description: Access token in the form of a JWT
      scheme: bearer

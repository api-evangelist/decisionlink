          - type: integer
          - type: string
          title: Value Prop Metric Id
          description: The ID for the value proposition metric
        driver_phase_2:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Phase 2
          description: The value for driver phase 2
        driver_phase_3:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Phase 3
          description: The value for driver phase 3
        driver_phase_4:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Phase 4
          description: The value for driver phase 4
        driver_phase_5:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Phase 5
          description: The value for driver phase 5
        driver_phase_6:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Phase 6
          description: The value for driver phase 6
        driver_phase_7:
          anyOf:
          - type: integer
          - type: 'null'
          title: Driver Phase 7
          description: The value for driver phase 7
        driver_phase_8:

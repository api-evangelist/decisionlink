  /v1/value-proposition/{valuePropId}/goals:
    get:
      tags:
      - goals
      summary: Read goals
      description: "Retrieve all value realization goals for a given Value Proposition.\n\nThis endpoint fetches every goal\
        \ associated with the specified\n`value_prop_id` from the database. If no goals exist, it returns\nan empty list.\n\
        \nArgs:\n    value_prop_id (int): The unique ID of the Value Proposition\n        whose goals should be returned.\n\
        \nReturns:\n    List[ValueRealizationGoal]: A list of fully populated\n    `ValueRealizationGoal` models, encoded\
        \ as JSON.\n\nRaises:\n    HTTPException: On any database error; will be caught and\n        re-reported as a 500\
        \ with an error message."
      operationId: get_goals_v1_value_proposition__valuePropId__goals_get
      security:
      - HTTPBearer: []
      parameters:
      - name: valuePropId
        in: path
        required: true
        schema:
          type: integer
          title: Valuepropid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValueRealizationGoal'
                title: Response Get Goals V1 Value Proposition  Valuepropid  Goals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - goals
      summary: Update goals
      description: "Bulk-update baseline, target, and active flags for multiple goals.\n\nAccepts a list of goal updates—each\
        \ containing an `id`, and any\ncombination of `baseline_value`, `value` (target), and `active`.\nMissing numeric fields\
        \ will default to 0 on update. After applying\nall updates, it re-queries the database and returns the fresh list\n\
        of goals.\n\nArgs:\n    goals (List[ValueRealizationGoalUpdate]):\n        A list of updates, where each element includes:\n\
        \          - `id` (int): the goal’s primary key\n          - `baseline_value` (float): new baseline (defaults to 0)\n\
        \          - `value` (float): new target value (defaults to 0)\n          - `active` (int): active flag, 0 or 1 (defaults\
        \ to 0)\n    value_prop_id (int): The Value Proposition ID under which\n        these goals are defined.\n\nReturns:\n\
        \    List[ValueRealizationGoal]: The updated full goal records,\n    each as a `ValueRealizationGoal` model, encoded\
        \ as JSON. If\n    no goals remain, returns an empty list.\n\nRaises:\n    HTTPException: If any individual update\
        \ or the final read\n        fails; re-reported as HTTP 500 with a JSON error payload."
      operationId: update_goals_v1_value_proposition__valuePropId__goals_put
      security:
      - HTTPBearer: []
      parameters:
      - name: valuePropId
        in: path
        required: true
        schema:
          type: integer
          title: Valuepropid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ValueRealizationGoalUpdate'
              title: Goals
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValueRealizationGoal'
                title: Response Update Goals V1 Value Proposition  Valuepropid  Goals Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

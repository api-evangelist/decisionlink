openapi: 3.2.0
info:
  title: Value Proposition Products API
  version: 0.1.0
  x-api-evangelist-source: https://api.xfactor.io/v1/value-proposition/openapi.json
servers:
- url: https://api.xfactor.io
  description: Production API host (Auth0 audience of the Xfactor.io web application)
tags:
- name: products
paths:
  /v1/value-proposition/products:
    get:
      tags:
      - products
      summary: List active products by account
      description: Endpoint to list active products by account
      operationId: get_products_v1_value_proposition_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Product'
                type: array
                title: Response Get Products V1 Value Proposition Products Get
      security:
      - HTTPBearer: []
components:
  schemas:
    Product:
      properties:
        product_id:
          type: integer
          title: Product Id
          description: Id of product
        name:
          type: string
          title: Name
          description: Name of product
      type: object
      required:
      - product_id
      - name
      title: Product
      description: Product model
  securitySchemes:
    HTTPBearer:
      type: http
      description: Access token in the form of a JWT
      scheme: bearer

          title: Achieved Benefits
          description: Achieved benefits (formatted)
        achieved_benefits_raw:
          type: number
          title: Achieved Benefits Raw
          description: Achieved benefits (raw)
        current_payback:
          type: string
          title: Current Payback
          description: Current payback (formatted)
        current_payback_raw:

          - type: string
          - type: 'null'
          title: Original Value Prop Id
          description: Original value proposition ID
        current_benefits:
          type: string
          title: Current Benefits
          description: Current benefits (formatted)
        current_benefits_raw:
          type: number
          title: Current Benefits Raw
          description: Current benefits (raw)
        expected_benefits:

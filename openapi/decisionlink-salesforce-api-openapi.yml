openapi: 3.2.0
info:
  title: Value Proposition Salesforce API
  version: 0.1.0
  x-api-evangelist-source: https://api.xfactor.io/v1/value-proposition/openapi.json
servers:
- url: https://api.xfactor.io
  description: Production API host (Auth0 audience of the Xfactor.io web application)
tags:
- name: salesforce
paths:
  /v1/value-proposition/groups-by-account:
    get:
      tags:
      - salesforce
      summary: Get value prop groups for account
      description: Endpoint for getting value prop groups for an account
      operationId: groups_by_account_v1_value_proposition_groups_by_account_get
      security:
      - HTTPBearer: []
      parameters:
      - name: account_defined_id
        in: query
        required: true
        schema:
          type: string
          title: Account Defined Id
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Company Id
      - name: opportunity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Opportunity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedResponse_VPGroupResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/value-proposition/value-props-by-account:
    get:
      tags:
      - salesforce
      summary: Get value props by account
      description: Endpoint for getting value props by account
      operationId: value_props_by_account_v1_value_proposition_value_props_by_account_get
      security:
      - HTTPBearer: []
      parameters:
      - name: account_defined_id
        in: query
        required: true
        schema:
          type: string
          title: Account Defined Id
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Company Id
      - name: opportunity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Opportunity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedResponse_ValuePropResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/value-proposition/value-trackers-by-account:
    get:
      tags:
      - salesforce
      summary: Get value trackers by account
      description: Endpoint for getting value trackers by account
      operationId: value_trackers_by_account_v1_value_proposition_value_trackers_by_account_get
      security:
      - HTTPBearer: []
      parameters:
      - name: account_defined_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Defined Id
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedResponse_list_ExternalTracker__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ExternalTracker:
      properties:
        value_prop_name:

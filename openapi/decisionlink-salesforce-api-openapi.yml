          title: Current Payback Raw
          description: Current payback (raw)
        expected_payback:
          type: string
          title: Expected Payback
          description: Expected payback (formatted)
        expected_payback_raw:
          type: number
          title: Expected Payback Raw
          description: Expected payback (raw)
        achieved_payback:
          type: string
          title: Achieved Payback
          description: Achieved payback (formatted)
        achieved_payback_raw:
          type: number
          title: Achieved Payback Raw
          description: Achieved payback (raw)
        expected_roi:
          type: string
          title: Expected Roi
          description: Expected ROI (formatted)
        expected_roi_raw:
          type: number
          title: Expected Roi Raw
          description: Expected ROI (raw)
        achieved_roi:
          type: string
          title: Achieved Roi
          description: Achieved ROI (formatted)
        achieved_roi_raw:
          type: number
          title: Achieved Roi Raw
          description: Achieved ROI (raw)
        expected_costs:
          type: string
          title: Expected Costs
          description: Expected costs (formatted)
        expected_costs_raw:
          type: number
          title: Expected Costs Raw
          description: Expected costs (raw)
        assigned_by:
          type: string
          title: Assigned By
          description: User who assigned the value prop
        created:
          type: string
          title: Created
          description: Creation timestamp
        valueprop_create_date_sfdc:
          type: string
          title: Valueprop Create Date Sfdc
          description: Creation date in SFDC (added on 1/31/22)
        creators_name:
          type: string
          title: Creators Name
          description: Creator's name (added on 1/31/22)
        last_modified_date:
          type: string
          title: Last Modified Date
          description: Last modified date (added on 1/31/22)
        last_modified_by_name:
          type: string
          title: Last Modified By Name
          description: Last modified by (added on 1/31/22)
        variance:
          type: string
          title: Variance
          description: Variance value (formatted)(added on 7/18/2023)
        variance_raw:
          type: number
          title: Variance Raw
          description: Variance value (raw)(added on 7/18/2023)
      type: object
      required:
      - value_prop_name
      - value_prop_id
      - company_name
      - original_user_id
      - current_benefits
      - current_benefits_raw
      - expected_benefits
      - expected_benefits_raw
      - achieved_benefits
      - achieved_benefits_raw
      - current_payback
      - current_payback_raw
      - expected_payback
      - expected_payback_raw
      - achieved_payback
